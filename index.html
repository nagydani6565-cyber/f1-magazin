<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Prix Insider | Google Sheets Automata F1</title>
    <style>
        :root {
            --bg: #060709;
            --card: #12141c;
            --accent: #FF1801;
            --text: #ffffff;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; }
        header { background: #000; border-bottom: 4px solid var(--accent); position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
        .logo { font-size: 22px; font-weight: 900; letter-spacing: -1px; text-decoration: none; color: #fff; }
        .logo span { color: var(--accent); }
        .wrapper { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        
        .ad-banner { background: #0b0c10; border: 1px dashed #334155; padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px; margin-bottom: 30px; font-weight: bold; border-radius: 4px; }

        .grid-view { display: grid; grid-template-columns: 1fr; gap: 25px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.3s; }
        .card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .card-body { padding: 25px; display: flex; flex-direction: column; flex-grow: 1; }
        .badge { background: var(--accent); color: #fff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 3px; display: inline-block; width: max-content; margin-bottom: 12px; text-transform: uppercase; }
        h2 { font-size: 22px; margin-bottom: 12px; line-height: 1.3; }
        .desc { color: var(--text-muted); font-size: 16px; margin-bottom: 20px; flex-grow: 1; }
        .btn { background: var(--accent); color: #fff; text-decoration: none; padding: 10px 20px; text-align: center; font-weight: bold; border-radius: 4px; font-size: 14px; cursor: pointer; border: none; align-self: flex-start; text-transform: uppercase; }
        
        .single-view { display: none; background: var(--card); border: 1px solid var(--border); padding: 35px; border-radius: 8px; }
        .back-btn { background: #334155; color: #fff; padding: 8px 16px; border-radius: 4px; cursor: pointer; display: inline-block; margin-bottom: 25px; font-weight: bold; font-size: 14px; }
        .full-text { font-size: 18px; color: #e2e8f0; margin-top: 25px; text-align: justify; }

        footer { background: #000; text-align: center; padding: 30px 20px; margin-top: 60px; font-size: 13px; color: var(--text-muted); border-top: 1px solid var(--border); }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="javascript:void(0)" onclick="goHome()" class="logo">GRAND PRIX<span>INSIDER</span></a>
        </div>
    </header>

    <div class="wrapper">
        <div class="ad-banner">HIRDETÉS HELYE (GOOGLE ADSENSE)</div>

        <!-- LISTA NÉZET -->
        <div id="grid-page" class="grid-view">
            <p style="text-align:center; width:100%; color:var(--text-muted);">Hírek élő szinkronizálása a Google Táblázatból...</p>
        </div>

        <!-- CIKK KIFEJTŐ NÉZET -->
        <div id="single-page" class="single-view">
            <div class="back-btn" onclick="goHome()">← Vissza a főoldalra</div>
            <span class="badge" id="single-badge">Kategória</span>
            <h1 id="single-title">Cím</h1>
            <div class="full-text" id="single-text">Szöveg</div>
        </div>
    </div>

    <footer>
        <p>© 2026 Grand Prix Insider. Minden jog fenntartva.</p>
    </footer>

    <script>
        // A te táblázatod pontos és ellenőrzött azonosítója
        const SHEET_ID = "1Pnz07nMhYg4eamfIRvhus6DRunAADnGLla2IGOyeaYw";
        const SHEET_URL = "https://google.com" + SHEET_ID + "/gviz/tq?tqx=out:json";

        let mentettHirek = [];

        async function hirekBetoltese() {
            const gridPage = document.getElementById('grid-page');
            try {
                const response = await fetch(SHEET_URL);
                const rawText = await response.text();
                
                // Kimásoljuk a tiszta JSON-t a Google válaszából
                const jsonText = rawText.match(/google\.visualization\.Query\.setResponse\(([\s\S\x00-\x7F]+)\);/);
                const data = JSON.parse(jsonText[1]);
                const rows = data.table.rows;

                gridPage.innerHTML = '';
                mentettHirek = [];

                if (!rows || rows.length === 0) {
                    gridPage.innerHTML = '<p style="text-align:center; width:100%; color:var(--text-muted)">A táblázatod elérhető, de még teljesen üres. Írd be a hírt a 2. sorba!</p>';
                    return;
                }

                rows.forEach((row) => {
                    // Biztonságos oszlop-párosítás (A=0: cím, B=1: bevezető, C=2: szöveg, D=3: kategória)
                    if (row.c && row.c.length >= 2) {
                        const hír = {
                            cim: (row.c[0] && row.c[0].v) ? row.c[0].v.toString() : 'Cím nélkül',
                            bevezeto: (row.c[1] && row.c[1].v) ? row.c[1].v.toString() : '',
                            szoveg: (row.c[2] && row.c[2].v) ? row.c[2].v.toString() : '',
                            kategoria: (row.c[3] && row.c[3].v) ? row.c[3].v.toString() : 'F1'
                        };
                        
                        mentettHirek.push(hír);

                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <div class="card-body">
                                <span class="badge">${hír.kategoria}</span>
                                <h2>${hír.cim}</h2>
                                <p class="desc">${hír.bevezeto}</p>
                                <button class="btn" onclick="cikkMegnyitasa(${mentettHirek.length - 1})">Elolvasom a cikket →</button>
                            </div>
                        `;
                        gridPage.appendChild(card);
                    }
                });

            } catch (error) {
                gridPage.innerHTML = '<p style="text-align:center; width:100%; color:var(--accent)">Hiba történt a Google Táblázat beolvasásakor. Győződj meg róla, hogy a megosztásnál beállítottad: "Bárki, aki rendelkezik a linkkel"!</p>';
            }
        }

        function cikkMegnyitasa(index) {
            const hír = mentettHirek[index];
            document.getElementById('grid-page').style.display = 'none';
            document.getElementById('single-page').style.display = 'block';
            document.getElementById('single-badge').innerText = hír.kategoria;
            document.getElementById('single-title').innerText = hír.cim;
            document.getElementById('single-text').innerHTML = hír.szoveg ? hír.szoveg.toString().replace(/\n/g, '<br><br>') : '';
            window.scrollTo(0,0);
        }

        function goHome() {
            document.getElementById('single-page').style.display = 'none';
            document.getElementById('grid-page').style.display = 'grid';
            window.scrollTo(0,0);
        }

        window.onload = hirekBetoltese;
    </script>
</body>
</html>
