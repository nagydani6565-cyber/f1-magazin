name: F1 Automatikus Hirfrissito Robot

on:
  schedule:
    - cron: '0 * * * *' # Minden órában lefut magától
  workflow_dispatch: # Manuális indítás gomb

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
    - name: Kod letöltése
      uses: actions/checkout@v4

    - name: Python beallitasa
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Modulok telepitese
      run: |
        python -m pip install --upgrade pip
        pip install feedparser deep-translator

    - name: F1 Hirek letoltese es beillesztese
      run: |
        python - <<EOF
        import feedparser
        from deep_translator import GoogleTranslator

        feed = feedparser.parse('https://bbci.co.uk')
        translator = GoogleTranslator(source='en', target='hu')

        cards_html = ""
        sub_pages_html = ""

        items = feed.entries[:5]
        for index, item in enumerate(items):
            try:
                title_hu = translator.translate(item.title).replace('"', '&quot;').replace("'", "&#39;")
                desc_hu = translator.translate(item.description).replace('"', '&quot;').replace("'", "&#39;")
                
                cards_html += f"""
                <div class="news-card">
                    <div class="card-body">
                        <span class="badge">F1 ÉLŐ PORTÁL</span>
                        <h2>{title_hu}</h2>
                        <p>{desc_hu}</p>
                        <span class="meta">Frissítve: Éppen most</span>
                        <a href="#cikk{index}" class="read-more-btn">Teljes cikk elolvasása →</a>
                    </div>
                </div>
                """
                
                sub_pages_html += f"""
                <div id="cikk{index}" class="sub-page">
                    <a href="#" class="back-btn">← Vissza a főoldalra</a>
                    <div class="news-card">
                        <div class="card-body">
                            <span class="badge">F1 ÉLŐ - Részletes nézet</span>
                            <h1>{title_hu}</h1>
                            <p>{desc_hu}</p>
                            <p>Műszaki részletek, pilótanyilatkozatok és a silverstone-i paddock legfrissebb háttérinformációi hamarosan elérhetőek lesznek a helyszíni tudósítóink jóvoltából a Grand Prix Insider magazin felületén.</p>
                        </div>
                    </div>
                </div>
                """
            except:
                continue

        # Beolvassuk az üres index.html-t
        with open("index.html", "r", encoding="utf-8") as f:
            content = f.read()

        # Pontosan behelyettesítjük a robot által generált tartalmat a sablonba
        content = content.replace("<!-- CARDS -->", cards_html)
        content = content.replace("<!-- SUBPAGES -->", sub_pages_html)

        # Elmentjük a kész, feltöltött index.html-t
        with open("index.html", "w", encoding="utf-8") as f:
            f.write(content)
        EOF

    - name: Mentes a tarhelyre
      run: |
        git config --global user.name "F1 Robot"
        git config --global user.email "robot@grandprixinsider.hu"
        git add index.html
        git commit -m "Automata F1 hirfrissites" || echo "Nincs uj"
        git pull --rebase origin main
        git push origin main
