name: F1 Automatikus Hirfrissito Robot

on:
  schedule:
    - cron: '0 * * * *' # Minden órában lefut teljesen magától
  workflow_dispatch: # Ad egy gombot, amivel te is elindíthatod manuálisan

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
    - name: Kod letöltése
      uses: actions/checkout@v3

    - name: Python beallitasa
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Modulok telepitese
      run: |
        python -m pip install --upgrade pip
        pip install feedparser deep-translator

    - name: F1 Hirek letoltese es forditasa
      run: |
        python - <<EOF
        import feedparser
        from deep_translator import GoogleTranslator

        feed = feedparser.parse('https://bbci.co.uk')
        translator = GoogleTranslator(source='en', target='hu')

        cards_html = ""
        sub_pages_html = ""

        items = feed.entries[:5]
        for index, item in enumerate(items):
            try:
                title_hu = translator.translate(item.title).replace('"', '&quot;').replace("'", "&#39;")
                desc_hu = translator.translate(item.description).replace('"', '&quot;').replace("'", "&#39;")
                
                cards_html += f"""
                <div class="news-card">
                    <div class="card-body">
                        <span class="badge">F1 ÉLŐ PORTÁL</span>
                        <h2>{{title_hu}}</h2>
                        <p>{{desc_hu}}</p>
                        <span class="meta">Automatikus frissítés</span>
                        <a href="#cikk{{index}}" class="read-more-btn">Teljes cikk elolvasása →</a>
                    </div>
                </div>
                """
                
                sub_pages_html += f"""
                <div id="cikk{{index}}" class="sub-page">
                    <a href="#" class="back-btn">← Vissza a főoldalra</a>
                    <div class="news-card">
                        <div class="card-body">
                            <span class="badge">F1 ÉLŐ - Részletes nézet</span>
                            <h1>{{title_hu}}</h1>
                            <p>{{desc_hu}}</p>
                            <p>Részletes technikai elemzések, nyilatkozatok és helyszíni telemetriai adatok hamarosan elérhetőek lesznek a helyszíni tudósítóink jóvoltából a Grand Prix Insider magazin felületén.</p>
                        </div>
                    </div>
                </div>
                """
            except:
                continue

        html_template = f"""<!DOCTYPE html>
        <html lang="hu">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Grand Prix Insider | Professzionális F1 Hírportál</title>
            <style>
                :root {{ --bg-color: #0c0d12; --card-bg: #161920; --text-main: #ffffff; --text-muted: #a0a5b5; --f1-red: #FF1801; --border: #242936; }}
                * {{ box-sizing: border-box; margin: 0; padding: 0; }}
                body {{ background-color: var(--bg-color); color: var(--text-main); font-family: system-ui, sans-serif; line-height: 1.6; font-size: 17px; }}
                header {{ background-color: #000000; border-bottom: 4px solid var(--f1-red); position: sticky; top: 0; z-index: 1000; }}
                .nav-container {{ max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }}
                .logo {{ font-size: 24px; font-weight: 900; color: var(--text-main); text-decoration: none; letter-spacing: -1px; }}
                .logo span {{ color: var(--f1-red); }}
                .wrapper {{ max-width: 800px; margin: 30px auto; padding: 0 20px; }}
                .ad-banner {{ background: #0b0c10; border: 1px dashed #334155; padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px; margin-bottom: 30px; font-weight: bold; border-radius: 4px; }}
                .sub-page {{ display: none; }}
                #main-view {{ display: block; }}
                body:has(#cikk0:target) #main-view {{ display: none; }}
                body:has(#cikk1:target) #main-view {{ display: none; }}
                body:has(#cikk2:target) #main-view {{ display: none; }}
                body:has(#cikk3:target) #main-view {{ display: none; }}
                body:has(#cikk4:target) #main-view {{ display: none; }}
                #cikk0:target, #cikk1:target, #cikk2:target, #cikk3:target, #cikk4:target {{ display: block; }}
                .news-card {{ background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 25px; }}
                .card-body {{ padding: 25px; }}
                .badge {{ background-color: var(--f1-red); color: white; padding: 4px 10px; font-size: 12px; font-weight: 800; text-transform: uppercase; border-radius: 3px; display: inline-block; margin-bottom: 12px; }}
                .read-more-btn {{ display: inline-block; background-color: var(--f1-red); color: white; text-decoration: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; margin-top: 15px; text-transform: uppercase; font-size: 14px; }}
                .back-btn {{ display: inline-block; background-color: #242936; color: white; text-decoration: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; margin-bottom: 20px; }}
                h1 {{ font-size: 32px; margin-bottom: 15px; }}
                h2 {{ font-size: 24px; margin-bottom: 15px; line-height: 1.3; }}
                p {{ color: var(--text-muted); margin-bottom: 20px; text-align: justify; }}
                .meta {{ font-size: 13px; color: #657585; font-weight: bold; margin-bottom: 10px; display: block; }}
                footer {{ background-color: #000000; border-top: 1px solid var(--border); padding: 40px 20px; text-align: center; margin-top: 60px; }}
                .disclaimer {{ font-size: 12px; color: #555; max-width: 600px; margin: 15px auto 0 auto; }}
            </style>
        </head>
        <body>
            <header>
                <div class="nav-container">
                    <a href="#" class="logo">GRAND PRIX<span>INSIDER</span></a>
                </div>
            </header>
            <div class="wrapper">
                <div class="ad-banner">HIRDETÉS HELYE (GOOGLE ADSENSE BANNER)</div>
                <div id="main-view">
                    {cards_html}
                </div>
                {sub_pages_html}
            </div>
            <footer>
                <div><strong>© 2026 Grand Prix Insider.</strong> Minden jog fenntartva.</div>
                <div class="disclaimer">Ez az oldal egy független hírportál. A Formula 1 és az F1 bejegyzett védjegyek.</div>
            </footer>
        </body>
        </html>"""

        with open("index.html", "w", encoding="utf-8") as f:
            f.write(html_template)
        EOF

    - name: Mentes a tarhelyre
      run: |
        git config --global user.name "F1 Robot"
        git config --global user.email "robot@grandprixinsider.hu"
        git add index.html
        git commit -m "Automata F1 hirfrissites" || echo "Nincs uj"
        git push
